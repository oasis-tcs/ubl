name: Build

on:
  push:
    branches-ignore:
      - 'claude/**'
  workflow_dispatch:

jobs:
  # Every job runs on Ubuntu 24.04, chosen on purpose rather than ubuntu-latest: what the build
  # installs (LibreOffice, fonts, pandoc, Playwright for the artwork) comes with the Ubuntu version,
  # and a newer one can change the output or stop a step. Playwright 1.56.1, for one, cannot install
  # its browser on Ubuntu 26.04, which ubuntu-latest becomes from 19 October 2026, so the figures
  # would no longer be rendered from their drawings. Move to a newer Ubuntu deliberately, after
  # comparing the packages built on both.
  staging:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    
    steps:
    - name: Generate Timestamp
      id: timestamp
      run: |
        timestamp=$(date -u +%Y%m%d-%H%M)
        echo "timestamp=${timestamp}" >> $GITHUB_OUTPUT
        echo "Generated timestamp: ${timestamp}"

  build:
    needs: staging
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Display Machine Details
      run: |
        echo "--- Runner Machine Details (Job: build) ---"
        echo "Hostname: $(hostname)"
        echo "OS/Kernel: $(uname -a)"
        echo "CPU Cores: $(nproc)"
        echo "CPU Model: $(lscpu | grep 'Model name' | sed 's/Model name:[[:space:]]*//')"
        echo "Total Memory: $(free -h | grep Mem | awk '{print $2}')"
        echo "------------------------------------------"

    - name: Confirm Saxon CLI class is in the JAR
      run: jar tf utilities/saxon9he/saxon9he.jar | grep net/sf/saxon/Transform.class || echo "Transform.class not found"

    - name: Set up JDK 1.8
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 8
        java-package: jdk

    - name: Dependencies
      # normally under a minute; when an Ubuntu package mirror stops answering,
      # apt waits without end, so stop it rather than hold the runner for hours
      timeout-minutes: 10
      run: |
        sudo apt update
        # LibreOffice is only used to convert spreadsheets from ODS to XLS, so
        # only its spreadsheet part is installed, without the desktop. The fonts
        # are the ones the full LibreOffice installs: XLS column widths are
        # worked out from font measurements, so the same fonts must be there.
        sudo apt install -y aspell pandoc libreoffice-calc-nogui \
          fonts-crosextra-caladea fonts-crosextra-carlito fonts-liberation-sans-narrow \
          fonts-linuxlibertine fonts-noto-core fonts-noto-extra fonts-noto-mono \
          fonts-noto-ui-core fonts-opensymbol fonts-sil-gentium fonts-sil-gentium-basic

    - name: Set up Node
      continue-on-error: true
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Artwork tools
      continue-on-error: true
      run: |
        npm install -g playwright@1.56.1
        playwright install --with-deps chromium
        sudo apt install -y fonts-liberation python3-pil

    - name: Build
      env:
        REALTA_USERNAME: ${{ secrets.REALTA_USERNAME }}
        REALTA_PASSWORD: ${{ secrets.REALTA_PASSWORD }}
      run: |
        mkdir target
        # every line of the output also goes, with the second it appeared, to a
        # file outside the repository for the "Timing summary" step below
        set -o pipefail
        bash build.sh target github ${{ needs.staging.outputs.timestamp }}z "${REALTA_USERNAME:-}" "${REALTA_PASSWORD:-}" DELETE-REPOSITORY-FILES-AS-WELL 2>&1 |
          while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            printf '%s %s\n' "$EPOCHSECONDS" "$line" >&3
          done 3>"$RUNNER_TEMP/build-times.log"

    - name: Timing summary
      if: always()
      run: |
        # A table of where the Build step spent its time, on the run's summary
        # page. A row starts at the first line of the build's output that is
        # (or, when it does not start with "-", begins with) the text before
        # the "|", and ends where the next row starts. To add a row, add a
        # line in the order the build does it.
        log="$RUNNER_TEMP/build-times.log"
        [ -s "$log" ] || exit 0
        cat > "$RUNNER_TEMP/build-rows.txt" <<'EOF'
        Artwork: rendering|Render the artwork from the draw.io drawings
        -make-artefacts:|Download the spreadsheets, make the genericode files
        -gc2ndr-check-only:|Check the models against the naming and design rules
        -artefacts:|Make the schemas, CVA files and spreadsheets
        -codelists:|Check the code lists, validate the samples
        -reports:|Make the HTML reports
        -package-artefacts:|Gather the artefacts
        -make-hub:|Assemble the documentation
        -make-docs:|Have Realta render the documentation
        -package-docs:|Package the documentation
        -package-distribution:|Package the distribution
        -consistency-check:|Check the consistency of the packages
        Total time:|Compress the packages (7z)
        EOF
        awk '
          function mmss(s) { return sprintf("%d:%02d", int(s / 60), s % 60) }
          NR == FNR { sub(/^ +/, ""); split($0, f, "|"); n++; text[n] = f[1]; name[n] = f[2]; next }
          {
            t = substr($0, 1, index($0, " ") - 1) + 0; line = substr($0, index($0, " ") + 1)
            if (!first) first = t; last = t
            for (i = 1; i <= n; i++)
              if (!(i in at) && (line == text[i] || (substr(text[i], 1, 1) != "-" && index(line, text[i]) == 1))) at[i] = t
            if (line ~ /^ *\[echo\] Submitting "/) { jobs++; sent[jobs] = t }
            if (index(line, "Realta server access ended")) back[jobs] = t
            if (index(line, "Early Realta job: submitting")) early = jobs + 1
            if (index(line, "Using the Realta results of the job sent earlier")) used = 1
          }
          END {
            print "### Where the Build step spent its time\n"
            print "| Step | Started | Took |"; print "|---|---:|---:|"
            for (i = 1; i <= n; i++) if (i in at) {
              end = last; for (j = i + 1; j <= n; j++) if ((j in at) && at[j] >= at[i]) { end = at[j]; break }
              printf "| %s | %s | %s |\n", name[i], mmss(at[i] - first), mmss(end - at[i])
            }
            printf "| **Whole Build step** | | **%s** |\n\n", mmss(last - first)
            for (k = 1; k <= jobs; k++) {
              what = (k == early) ? (used ? "sent early, while the artefacts were made and checked; its results were used" : "sent early; its results were not used") : "sent at the usual time"
              printf "Realta job %d: %s after it was sent (%s).\n\n", k, ((k in back) ? mmss(back[k] - sent[k]) : "no answer"), what
            }
            print "The run page lists the time of every other step."
          }
        ' "$RUNNER_TEMP/build-rows.txt" "$log" >> "$GITHUB_STEP_SUMMARY"

    - name: List Shell Build Directory Structure
      if: always()
      run: |
        echo "=== Shell Build Directory Structure ==="
        echo "Current directory: $(pwd)"
        echo ""
        echo "--- Root directory contents ---"
        ls -lah
        echo ""
        echo "--- Tree view of all directories (if target exists) ---"
        if [ -d target ]; then
          find target -type d | sort
          echo ""
          echo "--- File count in each directory ---"
          find target -type d -exec sh -c 'echo "{}": $(find "{}" -maxdepth 1 -type f | wc -l) files' \;
        else
          echo "target directory does not exist (expected after cleanup)"
        fi
        echo ""
        echo "--- Zip files in root ---"
        ls -lh *.7z 2>/dev/null || echo "No zip files found"

    - uses: actions/upload-artifact@v7
      with:
        name: UBL-package-github-${{ needs.staging.outputs.timestamp }}z
        path: ./*

  build-py:
    if: github.ref == 'refs/heads/ubl-2.5-python' && !startsWith(github.ref, 'refs/heads/claude/')
    needs: staging
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Display Machine Details
      run: |
        echo "--- Runner Machine Details (Job: build-py) ---"
        echo "Hostname: $(hostname)"
        echo "OS/Kernel: $(uname -a)"
        echo "CPU Cores: $(nproc)"
        echo "CPU Model: $(lscpu | grep 'Model name' | sed 's/Model name:[[:space:]]*//')"
        echo "Total Memory: $(free -h | grep Mem | awk '{print $2}')"
        echo "------------------------------------------"

    - name: Confirm Saxon CLI class is in the JAR
      run: jar tf utilities/saxon9he/saxon9he.jar | grep net/sf/saxon/Transform.class || echo "Transform.class not found"

    - name: Set up JDK 1.8
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 8
        java-package: jdk

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install -y aspell libreoffice pandoc
        pip install py7zr

    - name: Build
      env:
        REALTA_USERNAME: ${{ secrets.REALTA_USERNAME }}
        REALTA_PASSWORD: ${{ secrets.REALTA_PASSWORD }}
      run: |
        mkdir target
        python build.py target github ${{ needs.staging.outputs.timestamp }}z "${REALTA_USERNAME:-}" "${REALTA_PASSWORD:-}" DELETE-REPOSITORY-FILES-AS-WELL

    - name: List Python Build Directory Structure
      if: always()
      run: |
        echo "=== Python Build Directory Structure ==="
        echo "Current directory: $(pwd)"
        echo ""
        echo "--- Root directory contents ---"
        ls -lah
        echo ""
        echo "--- Tree view of all directories (if target exists) ---"
        if [ -d target ]; then
          find target -type d | sort
          echo ""
          echo "--- File count in each directory ---"
          find target -type d -exec sh -c 'echo "{}": $(find "{}" -maxdepth 1 -type f | wc -l) files' \;
        else
          echo "target directory does not exist (expected after cleanup)"
        fi
        echo ""
        echo "--- Zip files in root ---"
        ls -lh *.7z 2>/dev/null || echo "No zip files found"
        echo ""
        echo "--- Check what 7z thinks is in the ISO 7z ---"
        if [ -f "UBL-2.6-csd01-${{ needs.staging.outputs.timestamp }}z-iso-iec-19845.7z" ]; then
          7z l "UBL-2.6-csd01-${{ needs.staging.outputs.timestamp }}z-iso-iec-19845.7z"
        fi
        echo ""
        echo "--- Check what 7z thinks is in the main 7z ---"
        if [ -f "UBL-2.6-csd01-${{ needs.staging.outputs.timestamp }}z.7z" ]; then
          7z l "UBL-2.6-csd01-${{ needs.staging.outputs.timestamp }}z.7z" | head -50
        fi

    - uses: actions/upload-artifact@v7
      with:
        name: UBL-package-py-github-${{ needs.staging.outputs.timestamp }}z
        path: ./*
